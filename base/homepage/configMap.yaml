apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
    description: Personal homelab dashboard
    theme: dark
    color: slate
    hideVersion: true

    startUrl: http://homepage.core

    background:
      # image: /images/sky.png
      blur: md       # sm, "", md, xl... see https://tailwindcss.com/docs/backdrop-blur
      saturate: 100  # 0, 50, 100... see https://tailwindcss.com/docs/backdrop-saturate
      brightness: 75 # 0, 50, 75... see https://tailwindcss.com/docs/backdrop-brightness
      opacity: 50    # 0-100

    # cardBlur: xs

    layout:
      - Services:
          style: columns
      - Widgets:
          style: columns

    target: _blank

    language: en
    # Make homepage span full window width if desired
    # fullWidth: true

    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system.svc.cluster.local
        username: gerardo
        password: admin
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
        - Youtube:
            - abbr: Yt
              href: https://youtube.com/
        - AWS:
            - abbr: AWS
              href: https://aws.amazon.com/
        - Arch:
            - abbr: arch
              href: https://wiki.archlinux.org/
  services.yaml: |
    - k8s:
        - Pi-hole:
            href: http://pihole.home/admin
            description: DNS sinkhole
            icon: pi-hole.svg
        - Longhorn:
            href: http://longhorn.home
            description: Storage dashboard
            icon: longhorn.png
        - Prometheus:
            href: http://prometheus.home
            description: Metrics and monitoring
            icon: prometheus.svg
        - Grafana:
            href: http://grafana.home
            description: Storage dashboard
            icon: grafana.png
  widgets.yaml: |
    - datetime:
        format:
          # 13:37
          timeStyle: short
          hourCycle: h23

    - longhorn:
        provider: longhorn
        expanded: true
        total: true
        labels: true
        nodes: true

    - resources:
        label: System
        cpu: true
        memory: true

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
  docker.yaml: ""
