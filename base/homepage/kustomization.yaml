apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homepage

resources:
  - service.yaml
  - deployment.yaml
  - configMap.yaml
  - cluster-role.yaml
  - ingress.yaml
  - service-account.yaml
  - secret.yaml

labels:
  - pairs:
      app.kubernetes.io/name: homepage
      app.kubernetes.io/part-of: homelab
