apiVersion: v1
kind: Service
metadata:
  name: media-share
  namespace: jellyfin
  labels:
    app.kubernetes.io/name: media-share
    app.kubernetes.io/part-of: homelab
spec:
  type: LoadBalancer
  ports:
    - name: netbios-ssn
      port: 139
      targetPort: netbios-ssn
      protocol: TCP
    - name: smb
      port: 445
      targetPort: smb
      protocol: TCP
  selector:
    app.kubernetes.io/name: media-share
    app.kubernetes.io/part-of: homelab
