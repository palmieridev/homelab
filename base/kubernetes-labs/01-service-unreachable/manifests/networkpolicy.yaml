apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-check-to-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lab-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-check
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-check-egress
  annotations:
    homelab/description: Check uses Service IP so DNS egress is unnecessary
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lab-check
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: lab-api
      ports:
        - protocol: TCP
          port: 8080
