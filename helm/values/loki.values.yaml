# Replace values with correct grafana/loki SingleBinary schema, PVC persistence and simple ingress

# Use SingleBinary deployment mode for a simple homelab setup
deploymentMode: SingleBinary

# Core Loki configuration
loki:
  # Common config suitable for single-binary
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1

  # Use filesystem for object storage on the PVC
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  # Schema: boltdb-shipper on filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: boltdb-shipper
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  # Disable auth in homelab
  auth_enabled: false
  limits_config:
    allow_structured_metadata: false

  # Ruler local storage
  rulerConfig:
    wal:
      dir: /var/loki/ruler-wal

# Single-binary pod configuration
singleBinary:
  replicas: 1

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi

  # PVC persistence for single-binary
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    storageClass: longhorn
    enableStatefulSetAutoDeletePVC: true

# Set SimpleScalable components to 0 replicas to avoid mixed-mode validation
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# Optional: ServiceMonitor for Prometheus
monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s

# Simple ingress exposing the query frontend and push endpoints
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - loki.home
  # The chart expects a map of component -> array of paths
  paths:
    distributor:
      - /loki/api/v1/push
    queryFrontend:
      - /
      - /loki/api/v1/query
      - /loki/api/v1/query_range
      - /loki/api/v1/label
      - /loki/api/v1/labels
      - /loki/api/v1/series
    ruler:
      - /loki/api/v1/rules
    compactor:
      - /loki/api/v1/delete
